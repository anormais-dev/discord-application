name: build

on:
  push:
    branches: [main]

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      changed: ${{ steps.plan.outputs.changed }}
      unchanged: ${{ steps.plan.outputs.unchanged }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: plan
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)

          if [ -z "$last" ]; then
            previous=""
            changed="backend frontend"
            log=$(git log --format='%s%n%b')
            IFS=. read -r major minor patch <<< "0.0.0"
          else
            previous="${last#v}"
            files=$(git diff --name-only "$last" HEAD)
            changed=""
            grep -qE '^(backend/|infra/backend\.Dockerfile)' <<< "$files" && changed="$changed backend"
            grep -qE '^(frontend/|infra/frontend\.Dockerfile|infra/nginx\.conf)' <<< "$files" && changed="$changed frontend"
            log=$(git log "$last..HEAD" --format='%s%n%b')
            IFS=. read -r major minor patch <<< "$previous"
          fi

          if [ -z "$changed" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum app mudou desde $last, nada para buildar."
            exit 0
          fi

          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          version="$major.$minor.$patch"
          to_json() { jq -cn --arg s "$1" '$s | split(" ") | map(select(. != ""))'; }
          unchanged=$(comm -23 <(printf '%s\n' backend frontend) <(tr ' ' '\n' <<< "$changed" | sort))

          {
            echo "release=true"
            echo "version=$version"
            echo "previous=$previous"
            echo "changed=$(to_json "$changed")"
            echo "unchanged=$(to_json "$(tr '\n' ' ' <<< "$unchanged")")"
          } >> "$GITHUB_OUTPUT"

          echo "Versão $version (anterior: ${previous:-nenhuma}). Buildar: $changed. Reaproveitar: ${unchanged:-nada}."

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.changed) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.app }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          build-args: ${{ matrix.app == 'frontend' && format('DISCORD_CLIENT_ID={0}', vars.DISCORD_CLIENT_ID) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reaproveitar imagens dos apps sem mudança
        env:
          UNCHANGED: ${{ needs.prepare.outputs.unchanged }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          for app in $(jq -r '.[]' <<< "$UNCHANGED"); do
            docker buildx imagetools create \
              -t "$IMAGE_PREFIX-$app:$VERSION" \
              -t "$IMAGE_PREFIX-$app:latest" \
              "$IMAGE_PREFIX-$app:$PREVIOUS"
          done

      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
