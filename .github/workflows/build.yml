name: build

on:
  push:
    branches: [main]

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      changed: ${{ steps.plan.outputs.changed }}
      unchanged: ${{ steps.plan.outputs.unchanged }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: plan
        run: |
          declare -A paths=(
            [backend]='^(backend/|infra/backend\.Dockerfile)'
            [frontend]='^(frontend/|infra/frontend\.Dockerfile|infra/nginx\.conf)'
          )

          changed=()
          unchanged=()
          for app in backend frontend; do
            rev=$(docker buildx imagetools inspect "$IMAGE_PREFIX-$app:latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '[.. | objects | .Labels? // empty | .["org.opencontainers.image.revision"]? // empty] | first // empty')

            if [ -z "$rev" ] || ! git cat-file -e "$rev^{commit}" 2>/dev/null; then
              echo "$app: sem imagem latest com revisão conhecida, vai buildar."
              changed+=("$app")
            elif git diff --name-only "$rev" HEAD | grep -qE "${paths[$app]}"; then
              echo "$app: mudou desde ${rev::7}, vai buildar."
              changed+=("$app")
            else
              echo "$app: sem mudança desde ${rev::7}, reaproveita a imagem."
              unchanged+=("$app")
            fi
          done

          {
            echo "tag=${GITHUB_SHA::7}"
            echo "changed=$(jq -cn '$ARGS.positional' --args "${changed[@]}")"
            echo "unchanged=$(jq -cn '$ARGS.positional' --args "${unchanged[@]}")"
            echo "any=$([ ${#changed[@]} -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.changed) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.app }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.prepare.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.app == 'frontend' && format('DISCORD_CLIENT_ID={0}', vars.DISCORD_CLIENT_ID) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  retag:
    needs: [prepare, build]
    if: needs.prepare.outputs.any == 'true' && needs.prepare.outputs.unchanged != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reaproveitar imagens dos apps sem mudança
        env:
          UNCHANGED: ${{ needs.prepare.outputs.unchanged }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for app in $(jq -r '.[]' <<< "$UNCHANGED"); do
            docker buildx imagetools create -t "$IMAGE_PREFIX-$app:$TAG" "$IMAGE_PREFIX-$app:latest"
          done
