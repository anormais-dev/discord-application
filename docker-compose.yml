# Ambiente de desenvolvimento do frontend, sem precisar de Go nem do Discord.
# Uso: docker compose up, depois abra http://localhost:8080
services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      DIST_DIR: /dist
      DEV_AUTH: ${DEV_AUTH:-}
    volumes:
      - ./frontend:/app
      # node_modules e build ficam em volumes do Docker, não na sua máquina.
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/dist

  backend:
    build: ./backend
    environment:
      PORT: ${PORT:?defina PORT no .env}
      DEV_AUTH: ${DEV_AUTH:-}
    volumes:
      - frontend_dist:/static:ro
    ports:
      - "${APP_PORT:-8080}:${PORT:?defina PORT no .env}"
    depends_on:
      - frontend

volumes:
  frontend_node_modules:
  frontend_dist:
